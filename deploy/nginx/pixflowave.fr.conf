# Site statique pixflowave.fr (Astro)
# À copier dans /etc/nginx/sites-available/pixflowave.fr
# Certbot ajoutera ensuite lui-même la partie HTTPS (port 443) et la redirection.

# www.pixflowave.fr → pixflowave.fr
server {
    listen 80;
    listen [::]:80;
    server_name www.pixflowave.fr;
    return 301 $scheme://pixflowave.fr$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name pixflowave.fr;

    root /var/www/pixflowave.fr;
    index index.html;
    charset utf-8;

    # Pages : /mon-article/ → /mon-article/index.html
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
    error_page 404 /404.html;

    # Fichiers générés par Astro (nom unique à chaque version) : cache long
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    # Pages HTML : toujours vérifier qu'elles sont à jour
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Compression des textes
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/xml;

    # En-têtes de sécurité de base (répétés dans les blocs location qui ont leurs propres add_header)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
